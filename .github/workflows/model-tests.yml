name: Investor model tests
on:
  push:
    branches: [main]
    paths: ['docs/model.js', 'docs/index.html', 'tests/**', 'package.json', '.github/workflows/model-tests.yml']
  pull_request:
    paths: ['docs/model.js', 'docs/index.html', 'tests/**', 'package.json', '.github/workflows/model-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
